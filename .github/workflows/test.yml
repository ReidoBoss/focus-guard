name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Stats page and insights (offline)
        run: |
          node test/insights.test.js
          node test/opendota.test.js

      - name: Create a fake Steam + Dota 2 install
        run: node test/fake-steam.js

      - name: Install from this checkout (macOS / Linux)
        if: runner.os != 'Windows'
        run: sudo CI=1 bash ./install.sh

      - name: Install from this checkout (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install.ps1

      - name: End-to-end test
        run: node test/e2e.js

      - name: README one-liner (macOS / Linux)
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | sudo CI=1 bash
          curl -fs "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:43210/)api" | grep -q '"lockedAt":"'

      - name: README one-liner (Windows)
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          $url = (Get-Content "$env:ProgramFiles\FocusGuard\dota-limit\stats-url.txt" -Raw).Trim()
          if (-not ((Invoke-WebRequest "$($url)api" -UseBasicParsing).Content -match '"lockedAt":"')) { throw "state lost on reinstall" }

      - name: Uninstall (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          sudo bash ./install.sh --uninstall
          if curl -fs --max-time 3 http://127.0.0.1:43210/; then echo "service still running"; exit 1; fi
          if grep -q dota-limiter-stats /etc/hosts; then echo "hosts entry still there"; exit 1; fi

      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./install.ps1 -Uninstall
          if (Test-Path "$env:ProgramFiles\FocusGuard") { throw "install folder still there" }
          if (Select-String -Path "$env:windir\System32\drivers\etc\hosts" -Pattern "dota-limiter-stats" -Quiet) { throw "hosts entry still there" }

      - name: What owns port 80 (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-NetTCPConnection -LocalPort 80 -ErrorAction SilentlyContinue | Format-Table -AutoSize
          netsh int ipv4 show excludedportrange protocol=tcp
          netsh http show servicestate view=requestq | Select-String -Pattern "URL|Process" | Select-Object -First 20

      - name: Service logs
        if: failure()
        shell: bash
        run: |
          for f in /usr/local/focus-guard/dota-limit/log.txt /usr/local/focus-guard/dota-limit/error.txt /opt/focus-guard/dota-limit/log.txt "/c/Program Files/FocusGuard/dota-limit/log.txt"; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          command -v journalctl >/dev/null && sudo journalctl -u focus-guard --no-pager | tail -50 || true

  interactive:
    name: interactive ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Create a fake Steam + Dota 2 install
        run: node test/fake-steam.js

      - name: Answer the installer's questions (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          command -v expect >/dev/null || sudo apt-get install -y -qq expect >/dev/null
          expect test/interactive.exp install

      - name: Answer the installer's questions (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FG_INTERACTIVE = "1"
          # Dota: yes, fixed games, 3 (default), bad hour then 5, no OpenDota, tilt check on. Browsers: pick Brave, Edge, Firefox. Confirm.
          "y`n2`n`nbanana`n5`nn`ny`n2`ny`nn`ny`ny`ny`n" | powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: End-to-end test with those answers
        env:
          FG_EXPECT_BROWSERS: brave,edge,firefox
          FG_EXPECT_MODE: games
          FG_EXPECT_MAX: "3"
          FG_EXPECT_RESET: "5"
          FG_EXPECT_SAFARI: ${{ runner.os == 'macOS' && '1' || '0' }}
          FG_EXPECT_OPENDOTA: "0"
        run: node test/e2e.js

      - name: Uninstall, confirming the question (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          expect test/interactive.exp uninstall
          if [ -d /opt/focus-guard ] || [ -d /usr/local/focus-guard ]; then echo "still installed"; exit 1; fi

      - name: Uninstall, confirming the question (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FG_INTERACTIVE = "1"
          "y`n" | powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Uninstall
          if (Test-Path "$env:ProgramFiles\FocusGuard") { throw "still installed" }
          if (Test-Path "HKLM:\SOFTWARE\Policies\Google\Chrome\URLBlocklist") { throw "policy left behind" }

      - name: Service logs
        if: failure()
        shell: bash
        run: |
          for f in /usr/local/focus-guard/dota-limit/log.txt /usr/local/focus-guard/dota-limit/error.txt /opt/focus-guard/dota-limit/log.txt "/c/Program Files/FocusGuard/dota-limit/log.txt"; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
