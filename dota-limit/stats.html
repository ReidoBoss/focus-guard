<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota Limiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f13;
    --panel: #151920;
    --panel-2: #1b2029;
    --line: #262c37;
    --text: #e8eaee;
    --muted: #8a93a3;
    --win: #4ade80;
    --win-bg: rgba(74, 222, 128, 0.12);
    --loss: #f87171;
    --loss-bg: rgba(248, 113, 113, 0.12);
    --accent: #f5b642;
    --live: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 40px 0 12px; font-weight: 600; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--panel); }
  .pill.locked { color: var(--loss); border-color: rgba(248,113,113,.35); background: var(--loss-bg); }
  .pill.open { color: var(--win); border-color: rgba(74,222,128,.35); background: var(--win-bg); }
  .pill.live { color: var(--live); border-color: rgba(96,165,250,.35); background: rgba(96,165,250,.12); }

  .series { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
  .score { font: 700 56px/1 "JetBrains Mono", monospace; letter-spacing: -0.02em; }
  .score .w { color: var(--win); } .score .l { color: var(--loss); } .score .d { color: var(--muted); margin: 0 10px; }
  .verdict { color: var(--muted); margin-top: 8px; }
  .pips { display: flex; gap: 10px; }
  .pip { width: 44px; height: 44px; border-radius: 10px; border: 1.5px dashed var(--line); display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--muted); }
  .pip.win { border: 0; background: var(--win-bg); color: var(--win); }
  .pip.loss { border: 0; background: var(--loss-bg); color: var(--loss); }
  .pip.live { border: 1.5px solid var(--live); color: var(--live); animation: pulse 1.6s infinite; }
  .pip.skip { opacity: .35; }
  @keyframes pulse { 50% { opacity: .45; } }

  .match { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .match-top { display: grid; grid-template-columns: 112px 1fr auto; gap: 16px; align-items: center; padding: 16px; }
  .portrait { width: 112px; height: 63px; border-radius: 8px; background: var(--panel-2) center/cover; }
  .hero { font-weight: 700; font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge { font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
  .badge.win { background: var(--win-bg); color: var(--win); }
  .badge.loss { background: var(--loss-bg); color: var(--loss); }
  .badge.live { background: rgba(96,165,250,.12); color: var(--live); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border-top: 1px solid var(--line); }
  .stat { padding: 12px 16px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font: 700 16px "JetBrains Mono", monospace; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .items { display: flex; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .item { width: 44px; height: 32px; border-radius: 4px; background: var(--panel-2) center/cover; }
  .item.neutral { width: 32px; border-radius: 50%; margin-left: 8px; }
  .links { margin-left: auto; display: flex; gap: 12px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .empty { color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 24px; text-align: center; }

  .day { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .day .date { flex: 1; font-weight: 600; }
  .day .rec { font: 700 14px "JetBrains Mono", monospace; }
  .mini { display: flex; gap: 4px; }
  .mini i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); }
  .mini i.win { background: var(--win); } .mini i.loss { background: var(--loss); }
  .day-detail { margin: -2px 0 12px 16px; }

  @media (max-width: 600px) {
    .series { grid-template-columns: 1fr; }
    .score { font-size: 44px; }
    .match-top { grid-template-columns: 80px 1fr; }
    .portrait { width: 80px; height: 45px; }
    .match-top .badge { grid-column: 2; justify-self: start; }
  }

  .players-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .players-bar button { font: 600 13px Inter, system-ui, sans-serif; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .players-bar button:hover { border-color: var(--muted); }
  .players { border-top: 1px solid var(--line); padding: 4px 16px 16px; }
  .team-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 16px 0 8px; flex-wrap: wrap; }
  .team-head b { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .team-head b.ally { color: var(--win); } .team-head b.enemy { color: var(--loss); }
  .team-head span { color: var(--muted); font-size: 12px; }
  .player { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .player:first-of-type { border-top: 0; }
  .player.me { background: rgba(245,182,66,.06); border-radius: 8px; padding: 10px 8px; margin: 0 -8px; }
  .p-hero { width: 64px; height: 36px; border-radius: 6px; background: var(--panel-2) center/cover; }
  .p-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .p-name { font-weight: 700; }
  .p-name a { color: inherit; text-decoration: none; } .p-name a:hover { text-decoration: underline; }
  .rank { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--accent); }
  .p-stats { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); margin-top: 2px; }
  .p-stats b { color: var(--text); }
  .p-items { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .p-items i { width: 30px; height: 22px; border-radius: 3px; background: var(--panel-2) center/cover; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
  .chip.good { color: var(--win); background: var(--win-bg); }
  .chip.bad { color: var(--loss); background: var(--loss-bg); }
  .chip.info { color: var(--live); background: rgba(96,165,250,.12); }
  .chip.party { color: #c4b5fd; background: rgba(167,139,250,.14); }
  .tops { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .top { display: flex; align-items: center; gap: 6px; }
  .top i { width: 36px; height: 20px; border-radius: 3px; background: var(--panel-2) center/cover; }
  .top.current i { outline: 2px solid var(--accent); }
  .form { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: middle; }
  .form i { width: 7px; height: 12px; border-radius: 2px; background: var(--line); }
  .form i.win { background: var(--win); } .form i.loss { background: var(--loss); }
  @media (max-width: 600px) { .player { grid-template-columns: 48px 1fr; } .p-hero { width: 48px; height: 27px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dota Limiter <span id="daylabel"></span></h1>
    <div id="status" class="pill">Loading</div>
  </header>

  <section class="series">
    <div>
      <div class="score" id="score"></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="pips" id="pips"></div>
  </section>

  <h2>Today's matches</h2>
  <div id="matches"></div>

  <h2>History</h2>
  <div id="history"></div>
</div>

<script>
const CDN = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react";
const heroImg = (n) => n && `${CDN}/heroes/${n.replace("npc_dota_hero_", "")}.png`;
const itemImg = (n) => n && `${CDN}/items/${n.replace("item_", "")}.png`;
// Real hero names come from OpenDota when the service has them; otherwise tidy the internal name.
let HERO_LABELS = {};
const pretty = (n) => (!n ? "Unknown hero" : HERO_LABELS[n] || n.replace("npc_dota_hero_", "").split("_").map((w) => w[0].toUpperCase() + w.slice(1)).join(" "));
const clock = (s) => (s == null ? "-" : `${Math.floor(Math.max(s, 0) / 60)}:${String(Math.max(s, 0) % 60).padStart(2, "0")}`);
const num = (v) => (v == null ? "-" : Number(v).toLocaleString());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function tally(matches) {
  const list = Object.values(matches);
  return { list, wins: list.filter((m) => m.result === "win").length, losses: list.filter((m) => m.result === "loss").length };
}

function matchCard(id, m) {
  const d = m.details || {};
  const res = m.result || "live";
  const label = { win: "WIN", loss: "LOSS", live: "LIVE" }[res];
  const numeric = /^\d+$/.test(id);
  const when = new Date(m.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const score = d.radiant_score != null ? ` · ${d.radiant_score} - ${d.dire_score}` : "";
  const sub = m.details
    ? `${d.team ? d.team[0].toUpperCase() + d.team.slice(1) : ""}${d.level ? ` · Lvl ${d.level}` : ""} · ${clock(d.clock_time)}${score} · ${when}`
    : `${m.note || "No details recorded"} · ${when}`;
  const stats = m.details
    ? `<div class="stats">
        <div class="stat"><b>${num(d.kills)}/${num(d.deaths)}/${num(d.assists)}</b><small>K / D / A</small></div>
        <div class="stat"><b>${num(d.last_hits)}/${num(d.denies)}</b><small>LH / DN</small></div>
        <div class="stat"><b>${num(d.gpm)}</b><small>GPM</small></div>
        <div class="stat"><b>${num(d.xpm)}</b><small>XPM</small></div>
        <div class="stat"><b>${num(d.net_worth ?? d.gold)}</b><small>${d.net_worth != null ? "Net worth" : "Gold"}</small></div>
      </div>`
    : "";
  const items = (d.items || []).map((n) => `<div class="item" title="${esc(n || "empty")}" style="${n ? `background-image:url(${itemImg(n)})` : ""}"></div>`).join("");
  const neutral = d.neutral ? `<div class="item neutral" title="${esc(d.neutral)}" style="background-image:url(${itemImg(d.neutral)})"></div>` : "";
  const links = numeric
    ? `<div class="links">
        <a href="https://www.opendota.com/matches/${id}" target="_blank" rel="noopener">OpenDota</a>
        <a href="https://www.dotabuff.com/matches/${id}" target="_blank" rel="noopener">Dotabuff</a>
        <a href="https://stratz.com/matches/${id}" target="_blank" rel="noopener">STRATZ</a>
      </div>`
    : "";
  return `<div class="match">
    <div class="match-top">
      <div class="portrait" style="${d.hero ? `background-image:url(${heroImg(d.hero)})` : ""}"></div>
      <div><div class="hero">${esc(pretty(d.hero))}</div><div class="sub">${esc(sub)}</div></div>
      <span class="badge ${res}">${label}</span>
    </div>
    ${stats}
    ${items || links ? `<div class="items">${items}${neutral}${links}</div>` : ""}
    ${playersSection(id, m)}
  </div>`;
}


// ---------------------------------------------------------------- teammates and enemies
const RANKS = ["", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];
const ROLES = { 1: "safe lane", 2: "mid", 3: "off lane", 4: "jungle" };
const pct = (w, g) => (g ? Math.round((100 * w) / g) : 0);
const openPlayers = new Set();

function rankLabel(p) {
  const rt = p.rankTier || (p.profile && p.profile.rankTier);
  if (!rt) return "";
  const tier = Math.floor(rt / 10), stars = rt % 10;
  const lb = p.profile && p.profile.leaderboardRank;
  return tier === 8 ? `Immortal${lb ? " #" + lb : ""}` : `${RANKS[tier] || "?"}${stars ? " " + stars : ""}`;
}

function avgRank(players) {
  const tiers = players.map((p) => p.rankTier).filter(Boolean);
  if (!tiers.length) return "";
  const avg = Math.round(tiers.reduce((a, b) => a + b, 0) / tiers.length);
  return `avg ${rankLabel({ rankTier: avg })} (${tiers.length} ranked)`;
}

// Every chip is a quick read: who's dangerous, who's tilted, who you know.
function chips(p, ctx) {
  const out = [];
  const add = (tone, text) => out.push(`<span class="chip ${tone}">${esc(text)}</span>`);
  const prof = p.profile;
  if (p.isMe) add("info", "You");
  if (p.partyLabel) add("party", p.partyLabel);
  if (!p.accountId) add("", "Private profile");
  if (prof && prof.fhUnavailable) add("", "Match history not on OpenDota yet");
  if (prof && prof.games != null) {
    const wr = pct(prof.wins, prof.games);
    if (prof.games < 250 && wr >= 60) add("bad", `Possible smurf: ${prof.games} games, ${wr}% wins`);
    else if (prof.games < 100) add("", `New account: ${prof.games} games`);
    const top = prof.heroes[0];
    if (top && prof.games >= 50 && top.games / prof.games >= 0.2) {
      add("bad", `Spams ${pretty(top.hero)}: ${pct(top.games, prof.games)}% of games`);
    }
  }
  if (p.onHero && prof) {
    const rank = prof.heroes.findIndex((h) => h.hero === p.hero);
    // Counts include this match, so 1 game means it was their first.
    if (p.onHero.games <= 1) add("good", "First game on this hero");
    else if (rank === 0) add("bad", `On their most-played hero (${p.onHero.games} games, ${pct(p.onHero.win, p.onHero.games)}%)`);
    else if (rank > 0 && rank < 3 && p.onHero.games >= 10) add("bad", `Comfort pick: #${rank + 1} hero, ${p.onHero.games} games`);
    else if (p.onHero.games < 5) add("good", `Only ${p.onHero.games} games on this hero`);
  }
  if (prof && prof.recent.length) {
    // Includes this match: OpenDota is asked after it ends.
    let streak = 0;
    while (streak < prof.recent.length && prof.recent[streak].win === prof.recent[0].win) streak++;
    if (streak >= 3) add(prof.recent[0].win ? "bad" : "good", `${prof.recent[0].win ? "Won" : "Lost"} their last ${streak}`);
    const roles = {};
    for (const r of prof.recent) if (r.laneRole) roles[r.laneRole] = (roles[r.laneRole] || 0) + 1;
    const best = Object.entries(roles).sort((a, b) => b[1] - a[1])[0];
    if (best && best[1] >= 4) add("", `Usually ${ROLES[best[0]] || "lane " + best[0]} (${best[1]} of last ${prof.recent.length})`);
  }
  if (p.together) {
    const t = p.together;
    // These counts include this match.
    if (t.withGames > 1) add("info", `${t.withGames} games with you, ${pct(t.withWin, t.withGames)}% won`);
    if (t.againstGames > 1) add("info", `${t.againstGames} games against you, you won ${pct(t.againstWin, t.againstGames)}%`);
  }
  if (p.youWithHero && !p.isMe) {
    const h = p.youWithHero;
    if (ctx.ally && h.withGames >= 5) add(pct(h.withWin, h.withGames) >= 50 ? "good" : "bad", `You win ${pct(h.withWin, h.withGames)}% with ${pretty(p.hero)} on your team`);
    if (!ctx.ally && h.againstGames >= 5) add(pct(h.againstWin, h.againstGames) >= 50 ? "good" : "bad", `You're ${h.againstWin}-${h.againstGames - h.againstWin} against ${pretty(p.hero)}`);
  }
  if (ctx.most.heroDamage === p) add("", "Most hero damage");
  if (ctx.most.netWorth === p) add("", "Highest net worth");
  if (ctx.most.deaths === p && p.deaths >= 8) add("", "Most deaths");
  return out.join("");
}

function playerRow(p, ctx) {
  const prof = p.profile;
  const items = p.items.map((n) => `<i title="${esc(n || "empty")}" style="${n ? `background-image:url(${itemImg(n)})` : ""}"></i>`).join("");
  const name = p.accountId
    ? `<a href="https://www.opendota.com/players/${p.accountId}" target="_blank" rel="noopener">${esc(p.name || "Unknown")}</a>`
    : esc(p.name || "Anonymous");
  const rank = rankLabel(p);
  const mmr = prof && prof.estimatedMmr ? ` · ~${num(prof.estimatedMmr)} MMR` : "";
  const record = prof && prof.games ? ` · ${num(prof.games)} games, ${pct(prof.wins, prof.games)}% wins` : "";
  const form = prof && prof.recent.length
    ? `<span class="form" title="Last ${prof.recent.length} games, newest first">${prof.recent.map((r) => `<i class="${r.win ? "win" : "loss"}"></i>`).join("")}</span>`
    : "";
  const tops = prof && prof.heroes.length
    ? `<div class="tops">Most played:${prof.heroes.slice(0, 3).map((h) =>
        `<span class="top ${h.hero === p.hero ? "current" : ""}" title="${esc(pretty(h.hero))}"><i style="background-image:url(${heroImg(h.hero)})"></i>${h.games} · ${pct(h.win, h.games)}%</span>`).join("")} ${form}</div>`
    : "";
  return `<div class="player ${p.isMe ? "me" : ""}">
    <div class="p-hero" title="${esc(pretty(p.hero))}" style="${p.hero ? `background-image:url(${heroImg(p.hero)})` : ""}"></div>
    <div>
      <div class="p-line"><span class="p-name">${name}</span>${rank ? `<span class="rank">${esc(rank)}</span>` : ""}<span class="sub">${esc(pretty(p.hero))}${mmr}${record}</span></div>
      <div class="p-stats"><b>${p.kills}/${p.deaths}/${p.assists}</b> · ${num(p.netWorth)} NW · ${p.gpm}/${p.xpm} GPM/XPM · ${num(p.heroDamage)} dmg · Lvl ${p.level}</div>
      <div class="p-items">${items}${p.neutral ? `<i title="${esc(p.neutral)}" style="border-radius:50%;width:22px;background-image:url(${itemImg(p.neutral)})"></i>` : ""}</div>
      <div class="chips">${chips(p, ctx)}</div>
      ${tops}
    </div>
  </div>`;
}

function playersSection(id, m) {
  const od = m.opendota;
  if (!od) return "";
  if (od.status !== "ready") {
    const msg = od.status === "unavailable"
      ? "OpenDota never got this match, so there are no player details."
      : `Looking up the other players on OpenDota. Matches show up there a few minutes after they end.${od.tries ? ` (tried ${od.tries}x)` : ""}`;
    return `<div class="players-bar">${msg}<button data-lookup="${id}">Try now</button></div>`;
  }
  const players = od.players.slice();
  const me = players.find((p) => p.isMe);
  const myTeam = me ? me.team : m.details && m.details.team;

  // Letter each party that has two or more people in it.
  const parties = {};
  for (const p of players) if (p.partyId != null && p.partySize > 1) (parties[p.partyId] = parties[p.partyId] || []).push(p);
  let letter = 65;
  for (const group of Object.values(parties)) {
    if (group.length < 2) continue;
    const label = `Party ${String.fromCharCode(letter++)} (${group.length})`;
    for (const p of group) p.partyLabel = label;
  }

  const most = {};
  for (const k of ["heroDamage", "netWorth", "deaths"]) most[k] = players.reduce((a, b) => (b[k] > a[k] ? b : a));
  const team = (t) => players.filter((p) => p.team === t).sort((a, b) => (b.isMe ? 1 : 0) - (a.isMe ? 1 : 0) || a.slot - b.slot);
  const enemyTeam = myTeam === "radiant" ? "dire" : "radiant";
  const block = (t, ally) => `
    <div class="team-head"><b class="${ally ? "ally" : "enemy"}">${ally ? "Your team" : "Enemies"} · ${t === "radiant" ? "Radiant" : "Dire"}</b><span>${esc(avgRank(team(t)))}</span></div>
    ${team(t).map((p) => playerRow(p, { ally, most })).join("")}`;

  const open = openPlayers.has(id);
  return `<div class="players-bar">
      <button data-players="${id}">${open ? "Hide players" : "Show teammates and enemies"}</button>
      <span>${od.duration ? clock(od.duration) + " · " : ""}${od.radiantScore}-${od.direScore}</span>
    </div>
    ${open ? `<div class="players">${block(myTeam || "radiant", true)}${block(enemyTeam, false)}</div>` : ""}`;
}

function renderMatches(matches) {
  const entries = Object.entries(matches).sort((a, b) => a[1].startedAt.localeCompare(b[1].startedAt));
  return entries.length ? entries.map(([id, m]) => matchCard(id, m)).join("") : `<div class="empty">No games yet today.</div>`;
}

let openDay = null;

function render({ today, history }) {
  HERO_LABELS = today.heroLabels || {};
  const { list, wins, losses } = tally(today.matches);
  document.getElementById("daylabel").textContent = "· " + new Date(today.day + "T12:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });

  const st = document.getElementById("status");
  const reset = `${today.resetHour % 12 || 12}:00 ${today.resetHour < 12 ? "AM" : "PM"}`;
  if (today.dotaEnabled === false) { st.className = "pill"; st.textContent = "Dota limit off"; }
  else if (today.lockedAt) { st.className = "pill locked"; st.textContent = `Locked until ${reset}`; }
  else if (today.live) { st.className = "pill live"; st.textContent = "Match in progress"; }
  else { st.className = "pill open"; st.textContent = "Steam open"; }

  document.getElementById("score").innerHTML = `<span class="w">${wins}</span><span class="d">-</span><span class="l">${losses}</span>`;
  const bo3 = today.mode === "bo3";
  let verdict;
  if (bo3 && wins >= 2) verdict = "Series won. Done for today.";
  else if (bo3 && losses >= 2) verdict = "Series lost. Done for today. Come back sharper tomorrow.";
  else if (today.limitReached) verdict = "Done for today.";
  else if (bo3 && wins === 1 && losses === 1) verdict = "1-1. Next game decides it.";
  else verdict = bo3 ? "Best of 3. First to 2 wins." : `${Math.max(0, (today.maxGames || 3) - list.length)} games left today.`;
  document.getElementById("verdict").textContent = verdict;

  const ordered = list.sort((a, b) => a.startedAt.localeCompare(b.startedAt));
  const done = today.limitReached && !today.live;
  const slots = bo3 ? 3 : Math.max(today.maxGames || 3, list.length);
  document.getElementById("pips").innerHTML = [...Array(slots).keys()].map((i) => {
    const m = ordered[i];
    if (m) return m.result ? `<div class="pip ${m.result}">${m.result === "win" ? "W" : "L"}</div>` : `<div class="pip live">•</div>`;
    return `<div class="pip ${done ? "skip" : ""}">${i + 1}</div>`;
  }).join("");

  document.getElementById("matches").innerHTML = renderMatches(today.matches);

  document.getElementById("history").innerHTML = history.length
    ? history.map((d) => {
        const t = tally(d.matches);
        const minis = Object.values(d.matches).sort((a, b) => a.startedAt.localeCompare(b.startedAt)).map((m) => `<i class="${m.result || ""}"></i>`).join("");
        const date = new Date(d.day + "T12:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
        return `<div class="day" data-day="${d.day}"><span class="date">${date}</span><span class="mini">${minis}</span><span class="rec">${t.wins}-${t.losses}</span></div>
          ${openDay === d.day ? `<div class="day-detail">${renderMatches(d.matches)}</div>` : ""}`;
      }).join("")
    : `<div class="empty">Past days show up here after the 4 AM reset.</div>`;
}

let last;
async function refresh() {
  try {
    const data = await (await fetch("/api", { cache: "no-store" })).json();
    last = data;
    render(data);
  } catch {}
}

document.addEventListener("click", async (e) => {
  const toggle = e.target.closest("[data-players]");
  if (toggle) {
    const id = toggle.dataset.players;
    if (openPlayers.has(id)) openPlayers.delete(id);
    else openPlayers.add(id);
    if (last) render(last);
    return;
  }
  const retry = e.target.closest("[data-lookup]");
  if (retry) {
    retry.disabled = true;
    retry.textContent = "Looking up...";
    try { await fetch(`/api/lookup/${retry.dataset.lookup}`, { method: "POST" }); } catch {}
    setTimeout(refresh, 4000);
  }
});

document.getElementById("history").addEventListener("click", (e) => {
  const row = e.target.closest(".day");
  if (!row) return;
  openDay = openDay === row.dataset.day ? null : row.dataset.day;
  if (last) render(last);
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
